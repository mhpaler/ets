enum TargetType {
  URL
  BLINK
  UNKNOWN
}

enum BlinkChainAssetType {
  TXN
  BLOCK
  WALLET
  RECORD
  TOKEN
  NFT
  UNKNOWN
}

enum TagStatus {
  PENDING # TagCreated event received, waiting for coin deployment
  MINTED # CoinCreatedV4 event received, coin deployed
  FAILED # Deployment failed (future use)
}

# User entity that consolidates all wallet-based roles
type User @entity {
  "Wallet address as ID"
  id: ID!

  "First time this wallet was seen in any capacity"
  firstSeen: BigInt!

  "Last activity timestamp"
  lastActive: BigInt!

  # Role tracking (derived from relationships)
  "Whether this user has created any tags"
  isCreator: Boolean!

  "Whether this user has created any tagging records"
  isTagger: Boolean!

  "Whether this user owns any channels"
  isChannelOwner: Boolean!

  "Whether this user is an administrator"
  isAdministrator: Boolean!

  "Whether this user is a channel admin"
  isChannelAdmin: Boolean!

  # Creation Statistics
  "Total number of TAGs created"
  tagsCreated: BigInt!

  "Total number of tags created that were added to tagging records"
  createdTagsAddedToTaggingRecords: BigInt!

  "Total number of tags created that were removed from tagging records"
  createdTagsRemovedFromTaggingRecords: BigInt!

  "Total revenue from tags created by this user"
  createdTagsTaggingFeeRevenue: BigInt!

  # Tagging Statistics
  "Total number of tagging records created"
  taggingRecordsCreated: BigInt!

  "Total tagging record transactions"
  taggingRecordTxns: BigInt!

  "Total tags applied in tagging records"
  tagsApplied: BigInt!

  "Total tags removed from tagging records"
  tagsRemoved: BigInt!

  "Total tagging fees paid"
  feesPaid: BigInt!

  # Channel Ownership Statistics
  "Total number of channels owned"
  channelsOwned: BigInt!

  "Total number of channels created"
  channelsCreated: BigInt!

  # Relationships
  "TAGs created by this user"
  createdTags: [Tag!]! @derivedFrom(field: "creatorUser")

  "Tagging records created by this user"
  createdTaggingRecords: [TaggingRecord!]! @derivedFrom(field: "taggerUser")

  "Tags used by this user (for tagging)"
  usedTags: [Tag!]!
}

type Target @entity {
  "Id of Target"
  id: ID!

  "Target creation date."
  created: BigInt!

  "Wallet address of Target creator. Usually ETS Core contract."
  createdBy: String!

  "URI of target."
  targetURI: String!

  "Type of URI, limited to TargetType enumerated values."
  targetType: TargetType!

  "Keywords about target, derived from URI."
  targetTypeKeywords: [String!]

  # Enrichment tracking
  "Timestamp when target was enriched (0 if not enriched)"
  enriched: BigInt!

  "Address that performed the enrichment"
  enrichedBy: String

  "Schema version of the enrichment metadata (e.g. 'ets-metadata-v1')"
  schemaVersion: String

  "Hash of the enrichment payload for integrity verification"
  payloadHash: String

  # Core metadata fields (populated after enrichment)
  "Title extracted from target"
  title: String

  "Description extracted from target"
  description: String

  "Primary image URL"
  image: String

  "Favicon URL"
  favicon: String

  "HTTP status code from enrichment fetch"
  httpStatus: BigInt!

  "Content type of the target (e.g. 'text/html', 'image/png')"
  contentType: String

  "Language of the content (ISO 639-1)"
  language: String

  "Timestamp when metadata was extracted"
  extractedAt: BigInt

  "Method used to extract metadata"
  extractionMethod: String

  "Content type classification"
  metadataType: String

  "Platform identification (e.g. 'github', 'youtube', 'twitter')"
  platform: String

  "Keywords for searchability"
  keywords: [String!]

  # Type-specific metadata (optional one-to-one relationships)
  htmlMetadata: HtmlMetadata
  imageMetadata: ImageMetadata
}

# HTML specific metadata
type HtmlMetadata @entity {
  id: ID! # Same as Target id

  # HTML specific fields
  title: String
  description: String
  favicon: String

  # OpenGraph data
  ogTitle: String
  ogDescription: String
  ogImage: String
  ogSiteName: String
  ogUrl: String
  ogType: String

  # Twitter data
  twitterTitle: String
  twitterDescription: String
  twitterImage: String
  twitterCard: String

  # Structured data as JSON string (for Schema.org, etc.)
  structuredData: String

  # Raw JSON for OpenGraph and Twitter data (allows accessing fields we don't explicitly model)
  openGraphJson: String
  twitterJson: String

  # Creator/Author info
  creatorName: String
  creatorUrl: String
  creatorHandle: String
  creatorVerified: Boolean

  # Temporal context
  publishedAt: BigInt
  modifiedAt: BigInt

  # Article/Video metrics
  views: BigInt
  likes: BigInt
  reposts: BigInt
  replies: BigInt

  # Social context
  isReply: Boolean
  threadId: String
  quotedPost: String
  channel: String
}

# Image specific metadata
type ImageMetadata @entity {
  id: ID! # Same as Target id

  # Image dimensions
  width: Int
  height: Int

  # Image technical details
  fileSize: Int
  mimeType: String
  colorSpace: String

  # Media info (for images/videos)
  duration: Int # For video content (seconds)
  thumbnails: [String!]

  # Optional metadata
  exifData: String # JSON string with EXIF data if available
}

# Tag entity for TAG coins
type Tag @entity {
  "Composite ID: tagId-coinAddress for uniqueness"
  id: ID!

  "Unique incrementing TAG ID (1, 2, 3...)"
  tagId: BigInt!

  "Coin address of the TAG"
  coinAddress: Bytes!

  "Original input string as entered by user"
  originalInput: String!

  "Display version (formatted for UI)"
  displayVersion: String!

  "Machine name (lowercase normalized)"
  machineName: String!

  "Wallet credited with creating TAG (legacy - use creatorUser)"
  creator: Creator!

  "User who created this TAG"
  creatorUser: User!

  "Contract address of Channel that facilitated TAG creation."
  channel: Channel!

  "Creation date."
  timestamp: BigInt!

  # TAG Coin Lifecycle Tracking
  "Deployment status of the TAG coin"
  status: TagStatus!

  "Timestamp when Zora coin was successfully minted (0 if still pending)"
  mintedAt: BigInt!

  "Transaction hash of Zora CoinCreatedV4 event"
  mintTxHash: String

  "Zora protocol metadata URI for the coin"
  uri: String

  # Usage Tracking
  "Number of times TAG has been used to tag content."
  tagAppliedInTaggingRecord: BigInt!

  "Number of times TAG has been removed from tagging record."
  tagRemovedFromTaggingRecord: BigInt!

  "Total platform revenue from tagging fees for TAG (100% in MVP)."
  platformRevenue: BigInt!

  "Tagging records containing this TAG."
  taggingRecords: [TaggingRecord!]! @derivedFrom(field: "tags")
}

# Lookup entity for finding tags by numeric ID
type TagByNumber @entity {
  "The numeric tag ID as string"
  id: ID!

  "Reference to the actual Tag entity"
  tag: Tag!
}

# Lookup entity for finding tags by coin address
type TagByCoinAddress @entity {
  "The coin address as string"
  id: ID!

  "Reference to the actual Tag entity"
  tag: Tag!
}

type TaggingRecord @entity {
  "Tagging Record Id."
  id: ID!

  "Tagging record transaction hash."
  txnHash: String!

  "Entity relationship field for TAGs used in tagging record."
  tags: [Tag!]

  "Tagging record target as entity relationship."
  target: Target!

  "Arbitrary identifier for type of tagging record."
  recordType: String!

  "Tagger (wallet address that triggered tagging record) entity relationship (legacy - use taggerUser)."
  tagger: Tagger!

  "User who created this tagging record"
  taggerUser: User!

  "Channel (address of contract that facilitated tagging record creation) entity relationship."
  channel: Channel!

  "Tagging record creation date."
  timestamp: BigInt!
}

type Administrator @entity {
  id: ID!
  firstSeen: BigInt!
}

type Platform @entity {
  id: ID!
  address: String!
  firstSeen: BigInt!

  "Total count of targets on ETS."
  targetCount: BigInt!

  "Total count of TAGs created on ETS."
  tagsCount: BigInt!

  "Total count of tagging records on ETS."
  taggingRecordsCount: BigInt!

  "Total revenue generated from tagging fees."
  taggingFeesRevenue: BigInt!

  "Total count of currently active (not paused) Channels."
  channelCountActive: BigInt!

  "Total count of ETS Channels (paused & unpaused)."
  channelCountLifetime: BigInt!

  "Total count of unique tagger addresses."
  taggerCount: BigInt!

  "Total count of unique creator addresses."
  creatorCount: BigInt!
}

type ChannelAdmin @entity {
  id: ID!
  firstSeen: BigInt!
}

type Channel @entity {
  "Address of Channel contract."
  id: ID!

  "Name of Channel."
  name: String!

  "Channel contract is locked by Protocol."
  lockedByProtocol: Boolean!

  "Channel contract paused by owner"
  pausedByOwner: Boolean

  "Owner of channel contract (wallet address)"
  owner: String!

  "User who owns this channel"
  ownerUser: User!

  "Initial creator of channel contract (wallet address)"
  creator: String!

  "User who created this channel"
  creatorUser: User!

  "Channel is a protocol address for testing purposes."
  admin: Boolean!

  "Channel creation date."
  firstSeen: BigInt!

  "Total number of TAGs published by Channel."
  tagsPublished: BigInt!

  "Total number of Tagging Records published by Channel."
  taggingRecordsPublished: BigInt!

  "Total lifetime Tagging Record interactions."
  taggingRecordTxns: BigInt!

  "Total lifetime count of tags applied in tagging records."
  tagsApplied: BigInt!

  "Total lifetime count of tags removed from tagging records."
  tagsRemoved: BigInt!

  "Total number of tags published by Channel added to Tagging Records"
  publishedTagsAddedToTaggingRecords: BigInt!

  "Total number of tags published by Channel removed from Tagging Records"
  publishedTagsRemovedFromTaggingRecords: BigInt!

  "Total revenue generated from tagging fees from tags published by Channel."
  publishedTagsTaggingFeeRevenue: BigInt!

  "Tagging records published by this Channel."
  taggingRecords: [TaggingRecord!]! @derivedFrom(field: "channel")

  "TAGs published by this Channel."
  tags: [Tag!]! @derivedFrom(field: "channel")
}

type Tagger @entity {
  "Tagger address."
  id: ID!

  "Tagger creation date."
  firstSeen: BigInt!

  "Total number of Tagging Records created."
  taggingRecordsCreated: BigInt!

  "Total lifetime Tagging Record interactions."
  taggingRecordTxns: BigInt!

  "Total lifetime count of tags applied in tagging records."
  tagsApplied: BigInt!

  "Total lifetime count of tags removed from tagging records."
  tagsRemoved: BigInt!

  "Total lifetime tagging fees paid."
  feesPaid: BigInt!

  "Tags applied by this Tagger"
  tags: [Tag!]!

  "Tagging records created by this Tagger."
  taggingRecords: [TaggingRecord!]! @derivedFrom(field: "tagger")
}

type Creator @entity {
  "Address of Creator"
  id: ID!

  "Creator creation date."
  firstSeen: BigInt!

  "Total number of TAGs created."
  tagsCreated: BigInt!

  "Total number of tags created added to Tagging Records."
  createdTagsAddedToTaggingRecords: BigInt!

  "Total number of tags created removed from Tagging Records."
  createdTagsRemovedFromTaggingRecords: BigInt!

  "Total revenue generated from tagging fees from tags created by Creator."
  createdTagsTaggingFeeRevenue: BigInt!

  "TAGs created by this Creator."
  tags: [Tag!]! @derivedFrom(field: "creator")
}

type Release @entity {
  id: ID!
  #Contract Versions
  ets: String!
  etsVersion: BigInt!
  etsVersionDate: BigInt!

  etsAccessControls: String!
  etsAccessControlsVersion: BigInt!
  etsAccessControlsVersionDate: BigInt!

  etsToken: String!
  etsTokenVersion: BigInt!
  etsTokenVersionDate: BigInt!

  etsTarget: String!
  etsTargetVersion: BigInt!
  etsTargetVersionDate: BigInt!
}

type GlobalSettings @entity {
  id: ID!

  # Tags
  tagMinStringLength: BigInt!
  tagMaxStringLength: BigInt!

  # Tagging
  taggingFee: BigInt!
  taggingFeePlatformPercentage: BigInt!
  taggingFeeChannelPercentage: BigInt!
}
