# Production Environment - Uses Temporal Cloud + Base Mainnet
# This configuration is for production deployments where we connect to:
# - Temporal Cloud (managed service) 
# - Base mainnet
# - Production-grade monitoring and logging

services:
  # Local PostgreSQL for any application-specific data (optional)
  postgresql:
    container_name: temporal-postgresql-prod
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: temporal_prod
      POSTGRES_DB: temporal_prod
    ports:
      - "5434:5432"  # Different port to avoid conflicts
    volumes:
      - temporal-postgres-prod-data:/var/lib/postgresql/data
    networks:
      - temporal-prod-network
    profiles:
      - local-postgres  # Only start if explicitly requested
    restart: unless-stopped

  # Temporal Processor - connects to Temporal Cloud
  temporal-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temporal-processor-prod
    environment:
      - NODE_ENV=production
      - CHAIN_ID=8453  # Base Mainnet
      - TEMPORAL_SERVER_URL=${TEMPORAL_CLOUD_URL}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-production}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-ets-workflows}
      - TEMPORAL_CLIENT_CERT=${TEMPORAL_CLIENT_CERT}
      - TEMPORAL_CLIENT_KEY=${TEMPORAL_CLIENT_KEY}
      - RPC_URL=${BASE_MAINNET_RPC_URL}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - OFFCHAIN_API_URL=${PROD_OFFCHAIN_API_URL:-https://api.ets.xyz}
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - temporal-prod-logs:/app/logs
    depends_on:
      - postgresql
    profiles:
      - processor  # Can be started independently
    networks:
      - temporal-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

volumes:
  temporal-postgres-prod-data:
    driver: local
  temporal-prod-logs:
    driver: local

networks:
  temporal-prod-network:
    driver: bridge
    name: temporal-prod-network