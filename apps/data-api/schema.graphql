enum TargetType {
  URL
  BLINK
  UNKNOWN
}

enum BlinkChainAssetType {
  TXN
  BLOCK
  WALLET
  RECORD
  TOKEN
  NFT
  UNKNOWN
}

type Target @entity {
  "Id of Target"
  id: ID!

  "Target creation date."
  created: BigInt!

  "Wallet address of Target creator. Usually ETS Core contract."
  createdBy: String!

  "URI of target."
  targetURI: String!

  "Type of URI, limited to TargetType enumerated values."
  targetType: TargetType!

  "Keywords about target, derived from URI."
  targetTypeKeywords: [String!]

  "Target has been enriched with metadata."
  enriched: BigInt!

  "HTTP Status code returned from enrichment API for targetURI."
  httpStatus: BigInt!

  "Arweave TransactionId containing metadata json extracted for targetURI."
  arweaveTxId: String!

  # New relationships
  currentMetadata: TargetMetadata # Points to the most recent metadata
  metadataHistory: [TargetMetadata!]! @derivedFrom(field: "target") # All metadata records
}

# Base Metadata entity
type TargetMetadata @entity {
  id: ID! # The arweaveTxId
  target: Target!
  rawData: String! # Store the entire JSON as a string
  timestamp: BigInt!
  contentType: String
}

# This helps us look up targets by Arweave TX ID
type ArweaveTargetMapping @entity {
  id: ID! # The arweaveTxId
  target: Target!
}

# HTML specific metadata
type HtmlMetadata @entity {
  id: ID! # Same as parent Metadata id

  # HTML specific fields
  title: String
  description: String
  favicon: String

  # OpenGraph data
  ogTitle: String
  ogDescription: String
  ogImage: String
  ogSiteName: String
  ogUrl: String
  ogType: String

  # Twitter data
  twitterTitle: String
  twitterDescription: String
  twitterImage: String
  twitterCard: String

  # Structured data as JSON string (for Schema.org, etc.)
  structuredData: String

  # Raw JSON for OpenGraph and Twitter data (allows accessing fields we don't explicitly model)
  openGraphJson: String
  twitterJson: String
}

# Image specific metadata
type ImageMetadata @entity {
  id: ID! # Same as parent Metadata id

  # Image dimensions
  width: Int
  height: Int

  # Image technical details
  fileSize: Int
  fileType: String
  mimeType: String
  colorSpace: String

  # Optional metadata
  exifData: String # JSON string with EXIF data if available
}

# Create a record of metadata updates for auditing/history
type MetadataUpdateEvent @entity {
  id: ID! # Transaction hash + log index
  target: Target!
  metadata: TargetMetadata!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
  logIndex: BigInt!
  previousArweaveTxId: String # For tracking changes
}

# Tag entity for TAG coins
type Tag @entity {
  "Composite ID: tagId-coinAddress for uniqueness"
  id: ID!

  "Unique incrementing TAG ID (1, 2, 3...)"
  tagId: BigInt!

  "Coin address of the TAG"
  coinAddress: Bytes!

  "Original input string as entered by user"
  originalInput: String!

  "Display version (formatted for UI)"
  displayVersion: String!

  "Machine name (lowercase normalized)"
  machineName: String!

  "Wallet credited with creating TAG."
  creator: Creator!

  "Contract address of Channel that facilitated TAG creation."
  channel: Channel!

  "Creation date."
  timestamp: BigInt!

  "Number of times TAG has been used to tag content."
  tagAppliedInTaggingRecord: BigInt!

  "Number of times TAG has been removed from tagging record."
  tagRemovedFromTaggingRecord: BigInt!

  "Total platform revenue from tagging fees for TAG (100% in MVP)."
  platformRevenue: BigInt!

  "Tagging records containing this TAG."
  taggingRecords: [TaggingRecord!]! @derivedFrom(field: "tags")
}

# Lookup entity for finding tags by numeric ID
type TagByNumber @entity {
  "The numeric tag ID as string"
  id: ID!

  "Reference to the actual Tag entity"
  tag: Tag!
}

# Lookup entity for finding tags by coin address
type TagByCoinAddress @entity {
  "The coin address as string"
  id: ID!

  "Reference to the actual Tag entity"
  tag: Tag!
}

type TaggingRecord @entity {
  "Tagging Record Id."
  id: ID!

  "Tagging record transaction hash."
  txnHash: String!

  "Entity relationship field for TAGs used in tagging record."
  tags: [Tag!]

  "Tagging record target as entity relationship."
  target: Target!

  "Arbitrary identifier for type of tagging record."
  recordType: String!

  "Tagger (wallet address that triggered tagging record) entity relationship."
  tagger: Tagger!

  "Channel (address of contract that facilitated tagging record creation) entity relationship."
  channel: Channel!

  "Tagging record creation date."
  timestamp: BigInt!
}

type Administrator @entity {
  id: ID!
  firstSeen: BigInt!
}

type Platform @entity {
  id: ID!
  address: String!
  firstSeen: BigInt!

  "Total count of targets on ETS."
  targetCount: BigInt!

  "Total count of TAGs created on ETS."
  tagsCount: BigInt!

  "Total count of tagging records on ETS."
  taggingRecordsCount: BigInt!

  "Total revenue generated from tagging fees."
  taggingFeesRevenue: BigInt!

  "Total count of currently active (not paused) Channels."
  channelCountActive: BigInt!

  "Total count of ETS Channels (paused & unpaused)."
  channelCountLifetime: BigInt!

  "Total count of unique tagger addresses."
  taggerCount: BigInt!

  "Total count of unique creator addresses."
  creatorCount: BigInt!
}

type ChannelAdmin @entity {
  id: ID!
  firstSeen: BigInt!
}

type Channel @entity {
  "Address of Channel contract."
  id: ID!

  "Name of Channel."
  name: String!

  "Channel contract is locked by Protocol."
  lockedByProtocol: Boolean!

  "Channel contract paused by owner"
  pausedByOwner: Boolean

  "Owner of channel contract"
  owner: String!

  "Initial creator of channel contract"
  creator: String!

  "Channel is a protocol address for testing purposes."
  admin: Boolean!

  "Channel creation date."
  firstSeen: BigInt!

  "Total number of TAGs published by Channel."
  tagsPublished: BigInt!

  "Total number of Tagging Records published by Channel."
  taggingRecordsPublished: BigInt!

  "Total lifetime Tagging Record interactions."
  taggingRecordTxns: BigInt!

  "Total lifetime count of tags applied in tagging records."
  tagsApplied: BigInt!

  "Total lifetime count of tags removed from tagging records."
  tagsRemoved: BigInt!

  "Total number of tags published by Channel added to Tagging Records"
  publishedTagsAddedToTaggingRecords: BigInt!

  "Total number of tags published by Channel removed from Tagging Records"
  publishedTagsRemovedFromTaggingRecords: BigInt!

  "Total revenue generated from tagging fees from tags published by Channel."
  publishedTagsTaggingFeeRevenue: BigInt!

  "Tagging records published by this Channel."
  taggingRecords: [TaggingRecord!]! @derivedFrom(field: "channel")

  "TAGs published by this Channel."
  tags: [Tag!]! @derivedFrom(field: "channel")
}

type Tagger @entity {
  "Tagger address."
  id: ID!

  "Tagger creation date."
  firstSeen: BigInt!

  "Total number of Tagging Records created."
  taggingRecordsCreated: BigInt!

  "Total lifetime Tagging Record interactions."
  taggingRecordTxns: BigInt!

  "Total lifetime count of tags applied in tagging records."
  tagsApplied: BigInt!

  "Total lifetime count of tags removed from tagging records."
  tagsRemoved: BigInt!

  "Total lifetime tagging fees paid."
  feesPaid: BigInt!

  "Tags applied by this Tagger"
  tags: [Tag!]!

  "Tagging records created by this Tagger."
  taggingRecords: [TaggingRecord!]! @derivedFrom(field: "tagger")
}

type Creator @entity {
  "Address of Creator"
  id: ID!

  "Creator creation date."
  firstSeen: BigInt!

  "Total number of TAGs created."
  tagsCreated: BigInt!

  "Total number of tags created added to Tagging Records."
  createdTagsAddedToTaggingRecords: BigInt!

  "Total number of tags created removed from Tagging Records."
  createdTagsRemovedFromTaggingRecords: BigInt!

  "Total revenue generated from tagging fees from tags created by Creator."
  createdTagsTaggingFeeRevenue: BigInt!

  "TAGs created by this Creator."
  tags: [Tag!]! @derivedFrom(field: "creator")
}

type Release @entity {
  id: ID!
  #Contract Versions
  ets: String!
  etsVersion: BigInt!
  etsVersionDate: BigInt!

  etsAccessControls: String!
  etsAccessControlsVersion: BigInt!
  etsAccessControlsVersionDate: BigInt!

  etsToken: String!
  etsTokenVersion: BigInt!
  etsTokenVersionDate: BigInt!

  etsTarget: String!
  etsTargetVersion: BigInt!
  etsTargetVersionDate: BigInt!
}

type GlobalSettings @entity {
  id: ID!

  # Tags
  tagMinStringLength: BigInt!
  tagMaxStringLength: BigInt!

  # Tagging
  taggingFee: BigInt!
  taggingFeePlatformPercentage: BigInt!
  taggingFeeChannelPercentage: BigInt!
}
